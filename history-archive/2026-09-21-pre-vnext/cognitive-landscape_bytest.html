<div style="max-width:1600px;margin:auto;padding:12px 32px 0;color:#99aac7;font:12px system-ui,sans-serif">纯 HTML 直连版 · DeepSeek · API Key 仅保存在当前页面内存中</div>

    <script>
(() => {
  const SIDES = ['正方','反方','中立'];
  const COLORS = {'正方':'#77a9ff','反方':'#b59aff','中立':'#c1d8f7'};
  const label = side => side === '中立' ? '中立观察' : side;
  const clean = text => text.replace(/^\s*(?:#{1,6}\s+|>\s*|[-*+]\s+|\d+[.)]\s+|\|\s*)/,'').replace(/\*\*|`/g,'').replace(/^\s*\||\|\s*$/g,'').trim();
  const ch = id => `CH${String(id).padStart(2,'0')}`;

  function parse(markdown, samples = [], mode = '正方') {
    const records = new Map();
    for (const [index,sample] of samples.entries()) {
      const id = sample.id ?? index+1;
      if (sample.state === 'complete' && sample.text?.trim() && SIDES.includes(sample.stance) && Number.isInteger(id) && id > 0) records.set(id,sample);
    }
    const denominators = Object.fromEntries(SIDES.map(side=>[side,[...records.values()].filter(sample=>sample.stance===side).length]));
    const nodes = [], omitted = [];
    let side = SIDES.includes(mode) ? mode : null, section = '', heading = '', current = null, fence = false;
    function flush() {
      if (!current) return;
      const item = current; current = null;
      if (!item.side || item.total !== denominators[item.side] || item.count < 1 || item.count > item.total) {
        omitted.push({title:item.title,reason:'频次分母与本视角成功样本不一致，或缺少视角标识'}); return;
      }
      const sourceLines = item.lines.filter(line=>/(?:来源|样本编号)\s*[:：]/.test(line));
      const sources = [...new Set(sourceLines.flatMap(line=>[...line.matchAll(/\bCH\s*0*(\d+)\b/gi)].map(match=>Number(match[1]))))];
      if (sourceLines.length && (sources.length !== item.count || sources.some(id=>records.get(id)?.stance!==item.side))) {
        omitted.push({title:item.title,reason:'来源编号的数量、成功状态或视角与频次不一致'}); return;
      }
      nodes.push({...item,id:`topic-${nodes.length+1}`,sources,verified:sources.length>0,ratio:item.count/item.total,
        description:item.lines.filter(line=>!/(?:来源|样本编号)\s*[:：]/.test(line)).map(clean).filter(Boolean).join('\n')});
    }
    for (const line of String(markdown).replace(/\r/g,'').split('\n')) {
      if (/^\s*(?:```|~~~)/.test(line)) {fence=!fence;continue;}
      if (fence) continue;
      const group = mode === '双方' && line.match(/^#\s+(正方|反方|中立(?:观察)?)\s*$/);
      if (group) {flush();side=group[1].startsWith('中立')?'中立':group[1];section='';heading='';continue;}
      const chapter = line.match(/^#{1,6}\s+(E[134567])\b/);
      if (chapter) {flush();section=chapter[1];heading='';}
      const frequencies = [...line.matchAll(/\[(高频|中频|低频)\s+(\d+)\s*\/\s*(\d+)\]/g)];
      if (frequencies.length) {
        flush();
        if (frequencies.length > 1) {omitted.push({title:clean(line),reason:'同一行包含多个频次，无法确定条目边界'});continue;}
        const frequency = frequencies[0], title = clean(line.replace(frequency[0],'')) || heading;
        if (!title) {omitted.push({title:'未命名条目',reason:'频次缺少对应论点'});continue;}
        current = {side,section,title,level:frequency[1],count:Number(frequency[2]),total:Number(frequency[3]),lines:[]};
      } else if (/^#{1,6}\s/.test(line)) {flush();heading=clean(line);}
      else if (current) current.lines.push(line);
    }
    flush();
    return {nodes,omitted,denominators,records};
  }

  const styles = `
    .atlas-map{color:#dce8ff;font:13px/1.65 "Segoe UI","Microsoft YaHei",sans-serif;min-width:0;container-type:inline-size}

    .atlas-map-aside h3{font-size:16px;line-height:1.6;margin:8px 0;color:#e5eeff}.atlas-map-aside p{white-space:pre-wrap;overflow-wrap:anywhere}.atlas-map-kicker{font:10px/1.4 Consolas,monospace;letter-spacing:1.5px;color:#86a9e4}
    .atlas-map-frequency{font:27px/1.4 Consolas,monospace;color:#a9c9ff}.atlas-map-sources{display:flex;gap:5px;flex-wrap:wrap}.atlas-map-sources button{padding:4px 7px;font-size:11px}
    .atlas-map-detail{max-height:210px;overflow:auto;color:#b0c1dc;font-size:12px}.atlas-map-sample{margin-top:12px}.atlas-map-sample pre{white-space:pre-wrap;max-height:270px;overflow:auto;background:#050e20;padding:12px;font-size:12px;color:#bbcdee}
    .atlas-map-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.atlas-map-pagination{display:flex;gap:8px;align-items:center}

    .atlas-map-empty{padding:26px;color:#a8bedf;border:1px dashed #345182;border-radius:9px}.atlas-map-issues{margin-top:12px;color:#b6c6e1;font-size:12px}
    @media(max-width:1100px){.atlas-map-layout{grid-template-columns:minmax(0,1fr)}.atlas-map-aside{border-left:0;border-top:1px solid #28416e;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 20px}.atlas-map-aside .atlas-map-sample{grid-column:1/-1}}
    @container(max-width:820px){.atlas-map-layout{grid-template-columns:minmax(0,1fr)}.atlas-map-aside{border-left:0;border-top:1px solid #28416e;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 20px}.atlas-map-aside .atlas-map-sample{grid-column:1/-1}}
    @media(max-width:600px){.atlas-map-svg{min-width:620px}.atlas-map-aside{display:block}.atlas-map-toolbar button{font-size:11px}.atlas-map-bottom{flex-wrap:wrap}}
  `;
  const svgStyles = `.topic{cursor:pointer;outline:none}.topic circle{transition:opacity .15s}.topic:hover .halo,.topic:focus .halo{opacity:1}.topic:focus .core{stroke:#fff;stroke-width:2}.topic-label{font:13px "Segoe UI","Microsoft YaHei",sans-serif;fill:#c4d5ee;pointer-events:none;opacity:0}.topic:hover .topic-label,.topic:focus .topic-label,.topic.selected .topic-label{opacity:1}.halo{opacity:.18}.topic.selected .halo{opacity:1}`;
  function render(host, options) {
    const {markdown,samples=[],mode='正方',isDemo=false,motion=''} = options;
    const data=parse(markdown,samples,mode);
    const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;};
    const s=(tag,attrs={},text)=>{const node=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,String(value)));if(text!==undefined)node.textContent=text;return node;};
    host._atlasMapResize?.disconnect();
    host.replaceChildren();
    const sheet=el('style',styles),wrap=el('div',undefined,'atlas-map');host.append(sheet,wrap);
    wrap.dataset.nodeCount=data.nodes.length;wrap.dataset.omittedCount=data.omitted.length;
    const toolbar=el('div',undefined,'atlas-map-toolbar'),sideFilter=el('select'),levelFilter=el('select'),search=el('input');
    sideFilter.setAttribute('aria-label','星图视角筛选');levelFilter.setAttribute('aria-label','星图频次筛选');search.setAttribute('aria-label','搜索星图论点');search.placeholder='搜索论点或章节…';search.type='search';
    for(const [value,text] of [['all','全部视角'],...SIDES.filter(side=>data.denominators[side]>0).map(side=>[side,`${label(side)} · ${data.denominators[side]} 份`])]){const option=el('option',text);option.value=value;sideFilter.append(option);}
    for(const value of ['全部频次','高频','中频','低频'])levelFilter.append(el('option',value));
    const exportButton=el('button','导出星图 .svg');exportButton.type='button';
    toolbar.append(sideFilter,levelFilter,search,exportButton);wrap.append(toolbar);
    wrap.append(el('p',`${isDemo?'演示数据 · ':''}节点大小表示本视角样本出现比例；轨道按报告的高／中／低频分类。距离不表示语义相似度，频次不表示论点价值。`,'atlas-map-note'));
    const layout=el('div',undefined,'atlas-map-layout'),canvas=el('div',undefined,'atlas-map-canvas'),aside=el('div',undefined,'atlas-map-aside');layout.append(canvas,aside);wrap.append(layout);
    const centerCanvas=()=>{if(canvas.clientWidth && canvas.scrollWidth>canvas.clientWidth)canvas.scrollLeft=(canvas.scrollWidth-canvas.clientWidth)/2;};
    host._atlasMapResize=new ResizeObserver(()=>{if(host.isConnected)centerCanvas();else host._atlasMapResize.disconnect();});
    host._atlasMapResize.observe(canvas);
    const bottom=el('div',undefined,'atlas-map-bottom'),summary=el('span',undefined,'atlas-map-note'),pagination=el('div',undefined,'atlas-map-pagination');
    const prev=el('button','上一页'),next=el('button','下一页'),pageLabel=el('span');prev.type=next.type='button';pagination.append(prev,pageLabel,next);bottom.append(summary,pagination);wrap.append(bottom);
    const list=el('div',undefined,'atlas-map-topic-list');list.setAttribute('aria-label','星图论点列表');wrap.append(list);
    wrap.append(el('p','连线仅表示两条论点在报告中标注了相同样本来源；只绘制与当前选中节点相连的线。虚线节点表示报告未列出来源。','atlas-map-note'));
    if(data.omitted.length){const issues=el('details',undefined,'atlas-map-issues');issues.append(el('summary',`${data.omitted.length} 个条目未绘入星图：查看数据问题`));for(const item of data.omitted)issues.append(el('p',`${item.title}：${item.reason}`));wrap.append(issues);}
    let page=0,selected=null,svg=null,visible=[];
    function showDetail(item) {
      aside.replaceChildren();
      if(!item){aside.append(el('p','点击节点查看论点及样本来源。'));return;}
      const intro=el('div');intro.append(el('div',`${label(item.side)} / ${item.section || 'REPORT'}`,'atlas-map-kicker'),el('h3',item.title),el('div',`${item.count} / ${item.total}`,'atlas-map-frequency'),el('p',`${item.level} · 本视角成功样本中的出现次数`,'atlas-map-note'));
      const detail=el('div');detail.append(el('p',item.description || '请结合下方报告正文阅读。','atlas-map-detail'));
      detail.append(el('p',item.verified?'来源编号及数量已与成功样本核对；论点归并仍需结合原文复核。':'报告未列出来源编号；这里仅展示报告标注的频次，不补造连线。','atlas-map-note'));
      const sources=el('div',undefined,'atlas-map-sources'),sourceView=el('div',undefined,'atlas-map-sample');
      for(const id of item.sources){const button=el('button',ch(id));button.type='button';button.addEventListener('click',()=>{sourceView.replaceChildren(el('div',`${ch(id)} · ${label(item.side)} · 完整样本`,'atlas-map-kicker'),el('pre',data.records.get(id).text));});sources.append(button);}
      detail.append(sources);aside.append(intro,detail,sourceView);
    }
    function draw() {
      const query=search.value.trim().toLocaleLowerCase();
      const filtered=data.nodes.filter(item=>(sideFilter.value==='all'||item.side===sideFilter.value)&&(levelFilter.value==='全部频次'||item.level===levelFilter.value)&&(!query||`${item.title} ${item.description} ${item.section}`.toLocaleLowerCase().includes(query)));
      const pages=Math.max(1,Math.ceil(filtered.length/48));page=Math.min(page,pages-1);visible=filtered.slice(page*48,page*48+48);
      if(!visible.some(item=>item.id===selected))selected=visible[0]?.id || null;
      const active=visible.find(item=>item.id===selected);canvas.replaceChildren();list.replaceChildren();
      summary.textContent=`${data.nodes.length} 个可视化条目 · 当前 ${filtered.length} 个匹配${data.omitted.length?` · ${data.omitted.length} 个待核对`:''}`;pageLabel.textContent=`${page+1} / ${pages}`;prev.disabled=page===0;next.disabled=page===pages-1;exportButton.disabled=!visible.length;
      if(!visible.length){svg=null;canvas.append(el('div',data.nodes.length?'没有匹配的论点，请调整筛选。':'报告中尚无可用的「论点 + 频次」标注。保留文字报告，补齐或核对频次后才能生成星图。','atlas-map-empty'));showDetail(null);return;}
      const sides=SIDES.filter(side=>visible.some(item=>item.side===side)),width=960,height=570;
      svg=s('svg',{viewBox:`0 0 ${width} ${height}`,class:`atlas-map-svg${visible.length>20?' dense':''}`,role:'img','aria-label':`${isDemo?'演示':'认知分布'}星图：${visible.length} 个论点`});
      svg.append(s('title',{},`${motion} · ${isDemo?'演示数据 · ':''}认知分布星图`),s('style',{},svgStyles),s('rect',{width,height,fill:'#060f22'}));
      for(let i=0;i<100;i++)svg.append(s('circle',{cx:(i*149+31)%width,cy:(i*97+43)%height,r:i%7===0?1.2:0.6,fill:'#9abbef',opacity:i%3===0?0.3:0.12}));
      svg.append(s('text',{x:24,y:27,fill:'#8eafe8','font-family':'Consolas,monospace','font-size':10,'letter-spacing':2},`COGNITIVE ATLAS / ${isDemo?'DEMO':'SAMPLE DISTRIBUTION'}`));
      const positions=new Map(),radii=sides.length===1?[80,140,200]:sides.length===2?[63,123,179]:[45,91,135];
      sides.forEach((side,sideIndex)=>{
        const cx=(sideIndex+0.5)*width/sides.length,cy=292;
        svg.append(s('text',{x:cx,y:62,fill:COLORS[side],'text-anchor':'middle','font-size':16,'font-family':'sans-serif'},`${label(side)} · N=${data.denominators[side]}`));
        radii.forEach((r,ring)=>{svg.append(s('circle',{cx,cy,r,fill:'none',stroke:'#294573','stroke-width':1,'stroke-dasharray':ring===2?'3 8':'1 0',opacity:0.7}));});
        svg.append(s('text',{x:cx,y:cy+5,fill:'#597cac','text-anchor':'middle','font-size':10,'letter-spacing':2},'IDEAS'));
        ['高频','中频','低频'].forEach((level,ring)=>{
          const entries=visible.filter(item=>item.side===side&&item.level===level);
          entries.forEach((item,index)=>{const angle=-Math.PI/2+index*2*Math.PI/entries.length+(ring===1?0.32:0);positions.set(item.id,{x:cx+Math.cos(angle)*radii[ring],y:cy+Math.sin(angle)*radii[ring]});});
        });
      });
      const edges=s('g',{'aria-hidden':'true'});svg.append(edges);
      if(active?.verified){const start=positions.get(active.id);for(const item of visible){if(item.id===active.id||item.side!==active.side||!item.verified)continue;const shared=item.sources.filter(id=>active.sources.includes(id));if(!shared.length)continue;const end=positions.get(item.id);const edge=s('line',{x1:start.x,y1:start.y,x2:end.x,y2:end.y,stroke:COLORS[item.side],'stroke-width':1+shared.length/5,opacity:0.23,'data-shared':shared.length});edge.append(s('title',{},`共享来源：${shared.map(ch).join('、')}`));edges.append(edge);}}
      for(const item of visible){
        const {x,y}=positions.get(item.id),radius=5+Math.sqrt(item.ratio)*11;
        const node=s('g',{transform:`translate(${x} ${y})`,class:`topic${selected===item.id?' selected':''}`,role:'button',tabindex:0,'aria-label':`${label(item.side)}：${item.title}，${item.level} ${item.count}/${item.total}`,'data-topic':item.id});
        node.append(s('title',{},`${item.title} · ${item.count}/${item.total}`),s('circle',{class:'halo',r:radius+8,fill:'none',stroke:COLORS[item.side],'stroke-width':1}),s('circle',{class:'core',r:radius,fill:COLORS[item.side],'fill-opacity':0.14,stroke:COLORS[item.side],'stroke-width':1.5,'stroke-dasharray':item.verified?'1 0':'3 3'}),s('circle',{r:2.5,fill:'#e2edff'}),s('text',{class:'topic-label',x:0,y:radius+20,'text-anchor':'middle'},item.title.length>12?item.title.slice(0,12)+'…':item.title));
        const activate=()=>{selected=item.id;draw();host.querySelector(`[data-topic="${item.id}"]`)?.focus({preventScroll:true});};node.addEventListener('click',activate);node.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();activate();}});svg.append(node);
        const button=el('button',`${label(item.side)} · ${item.title} · ${item.count}/${item.total}`);button.type='button';button.addEventListener('click',activate);list.append(button);
      }
      svg.append(s('text',{x:24,y:550,fill:'#819bbc','font-family':'sans-serif','font-size':11},'大小＝本视角出现比例 · 轨道＝频次类别 · 连线＝报告标注共享来源 · 虚线＝未列来源 · 位置不表示语义距离'));
      canvas.append(svg);showDetail(active);
      centerCanvas();
    }
    const reset=()=>{page=0;draw();};sideFilter.addEventListener('change',reset);levelFilter.addEventListener('change',reset);search.addEventListener('input',reset);prev.addEventListener('click',()=>{page--;draw();});next.addEventListener('click',()=>{page++;draw();});
    exportButton.addEventListener('click',()=>{if(!svg)return;const source=new XMLSerializer().serializeToString(svg);const url=URL.createObjectURL(new Blob([source],{type:'image/svg+xml;charset=utf-8'}));const link=el('a');link.href=url;link.download=`认知星图-${isDemo?'演示-':''}星图-${new Date().toISOString().slice(0,10)}.svg`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);});
    draw();return data;
  }
  globalThis.COGNITIVE_ATLAS_MAP=Object.freeze({parse,render});
  if(typeof module!=='undefined' && module.exports)module.exports=globalThis.COGNITIVE_ATLAS_MAP;
})();

</script>

1. 合并语义相同或高度相似的内容；高频常规方向与只出现一次的长尾都必须保留，不做 top-K。
2. 分母只使用当前视角的完整成功样本数；同一份样本对同一候选最多计一次。频率只描述本轮模型样本，不评价质量。
3. 按 S1 背景、S2 朴素论点、S3 结构分层、S4 朴素反驳整理。结构只在样本冻结后解释，不能反向改写朴素样本。
4. S3 分别保留固有定义域、切入/演绎定义域、标准 B0、分论点的全量候选。不要为了整齐补层或强拼一棵树。
5. 每项保留原始 CH 编号和逐字连续短引。结构重构必须标为 reconstructed，并指向已有的背景或朴素论点。
6. supports 只表示有同一样本原句依据的“分论点→标准”；不确定就不要画线，无归属分论点仍保留。

只输出一个 JSON 对象，不要 Markdown 围栏或解释：
{"items":[{"id":"n1","section":"naive","level":null,"title":"短标题","summary":"忠实概括","basis":"explicit","source_refs":[{"sample_id":1,"quote":"逐字连续短引"}],"derived_from":[]}],"relations":[],"notes":[]}

字段约束：section 只能是 background、naive、structure、rebuttal；仅 structure 的 level 使用 inherent、entry、criterion、subargument。非结构项 basis 必须为 explicit。关系格式为 {"from":"...","to":"...","kind":"scope|frames|supports","basis":"explicit|reconstructed","explanation":"...","source_refs":[...]}。scope 为 inherent→entry，frames 为 entry→criterion，supports 为 subargument→criterion。不要填写 count、total 或 rate，浏览器将依据通过逐字核验的来源计算。`;

  const REPORT_SECTIONS = ['background','naive','structure','rebuttal'];
  const REPORT_LEVELS = ['inherent','entry','criterion','subargument'];
  const REPORT_LEVEL_NAMES = {inherent:'固有定义域',entry:'切入 / 演绎定义域',criterion:'标准 / 判准 B0',subargument:'分论点'};
  const RELATION_LEVELS = {scope:['inherent','entry'],frames:['entry','criterion'],supports:['subargument','criterion']};
  const validText = (value,limit=12000) => typeof value === 'string' && !!value.trim() && value.length <= limit;

  function makePrompts(data, stance, branches=[], branchIds=[]) {
    const context = String(data.audience_context || '').trim();
    const perspective = stance === '中立' ? '中立观察（不代表第三个持方）' : stance;
    const settings = `辩题：${data.motion}\n分析视角：${perspective}\n持方：${stance}\n赛制：${data.format || '标准传辩'}\n${context ? `观众 / 背景设定（假设性分析条件）：${JSON.stringify(context)}\n` : ''}`;
    const contextRules = context ? `\n\n${CONTEXT_SYSTEM}` : '';
    if (branches.length) {
      const joined = branches.map((text,index)=>`### CH${pad(branchIds[index] || index+1)} · ${perspective}\n${text}`).join('\n\n--- 独立分支 ---\n\n');
      return {
        system:`${AGGREGATE_SYSTEM}${contextRules}`,
        user:`${settings}独立样本数：${branches.length}\n\n${joined}\n\n请只依据以上样本蒸馏，完整保留常规方向与长尾，不补写样本之外的深化或创新。`
      };
    }
    return {system:`${stance === '中立' ? NEUTRAL_SYSTEM : BRANCH_SYSTEM}${contextRules}`,user:`${settings}请从你自己的判断出发独立生成，不要假设其他分支的内容。`};
  }

  const RAW_CHUNKS = [
    {key:'background',label:'S1 背景',prefix:'bg',instruction:'只归并 S1 朴素背景 / 场景；不要输出论点、反驳或结构项。'},
    {key:'naive',label:'S2 论点',prefix:'n',instruction:'只归并 S2 朴素论点；不要输出背景、反驳或结构项。'},
    {key:'rebuttal',label:'S4 反驳',prefix:'rb',instruction:'只归并 S4 朴素反驳；不要输出背景、论点或结构项。'},
  ];
  const STRUCTURE_CHUNKS = [
    {key:'domains',levels:['inherent','entry'],label:'L1–L2 定义域',prefixes:{inherent:'ih',entry:'en'},instruction:'联合整理两个相邻层级：inherent 是辩题实词及价值判断词的一般词义边界；entry 是在该边界内聚焦的人群、情境或理解视角，并说明这种聚焦如何改变判断的重要性。不要把一个普通场景直接冒充 entry。'},
    {key:'arguments',levels:['criterion','subargument'],label:'L3–L4 论证层',prefixes:{criterion:'cr',subargument:'sa'},instruction:'联合整理两个相邻层级：criterion 是使当前持方成立的最大、最直接或最重要理由，必须有判断方向；subargument 是支持某个 criterion 的分维度理由。即使暂时没有明确标准归属，也保留有来源的分论点候选。'},
  ];

  function chunkBase(data,stance,records) {
    const perspective=stance==='中立'?'中立观察（不代表第三个持方）':stance;
    const samples=records.map(record=>`### CH${pad(record.id)} · ${perspective}\n${record.text}`).join('\n\n--- 独立分支 ---\n\n');
    const context=String(data.audience_context||'').trim();
    return {settings:`辩题：${data.motion}\n分析视角：${perspective}\n赛制：${data.format||'标准传辩'}\n${context?`观众 / 背景设定：${JSON.stringify(context)}\n`:''}`,samples};
  }

  function makeRawChunkPrompts(data,stance,records,spec) {
    const {settings,samples}=chunkBase(data,stance,records);
    return {
      system:`你是认知分布蒸馏器的一个独立分块。只根据冻结样本做语义归并，不生成新内容。高频常规方向和只出现一次的长尾都要保留；同一样本对同一候选最多计一次。${spec.instruction}\n\n只输出一个 JSON 对象：{"items":[{"id":"临时编号","section":"${spec.key}","level":null,"title":"短标题","summary":"忠实概括","basis":"explicit","source_refs":[{"sample_id":1,"quote":"逐字连续短引"}],"derived_from":[]}],"relations":[],"notes":[]}。不要填写频次；每条引文必须逐字存在于对应样本。不要代码围栏或说明文字。`,
      user:`${settings}完整成功样本数：${records.length}\n\n${samples}\n\n请完成 ${spec.label} 分块，并输出完整 JSON。`
    };
  }

  function makeStructureChunkPrompts(data,stance,records,spec,rawItems) {
    const {settings,samples}=chunkBase(data,stance,records);
    const catalog=rawItems.map(item=>({id:item.id,section:item.section,title:item.title,summary:item.summary,source_refs:item.source_refs}));

    return {
      system:`你是认知分布蒸馏器的结构解释分块。结构只在朴素样本冻结后解释，不能反向改写样本，也不能为完整而补造层级。${spec.instruction}\n\n本分块只允许 level 为 ${allowed}。只输出一个 JSON 对象：{"items":[${examples}],"relations":[],"notes":[]}。derived_from 必须引用下方已经核验的 background 或 naive 项 ID；subargument 至少引用一个 naive 项。结构项的每个来源必须被 derived_from 对应项的来源覆盖。不要填写频次，不要代码围栏或说明文字。`,
      user:`${settings}已经核验的朴素候选：\n${JSON.stringify(catalog)}\n\n冻结样本：\n${samples}\n\n请完成 ${spec.label} 分块，并输出完整 JSON。`
    };
  }

  function makeRelationChunkPrompts(data,stance,records,items) {
    const {settings,samples}=chunkBase(data,stance,records);
    const catalog=items.filter(item=>item.section==='structure').map(item=>({id:item.id,level:item.level,title:item.title,source_refs:item.source_refs}));
    const pairs=[];
    for(const [kind,[leftLevel,rightLevel]] of Object.entries(RELATION_LEVELS)){
      for(const from of items.filter(item=>item.section==='structure'&&item.level===leftLevel))for(const to of items.filter(item=>item.section==='structure'&&item.level===rightLevel)){

      system:`你是认知分布蒸馏器的关系核对分块。只输出有同一样本逐字原句依据的跨层关系，不确定就不画线。允许的关系只有 scope（inherent→entry）、frames（entry→criterion）、supports（subargument→criterion）。仅共现、相似或空间邻近不能证明关系。\n\n只输出一个 JSON 对象：{"items":[],"relations":[{"from":"节点 ID","to":"节点 ID","kind":"scope|frames|supports","basis":"explicit|reconstructed","explanation":"原句如何支持该关系","source_refs":[{"sample_id":1,"quote":"显示关系的逐字连续短引"}]}],"notes":[]}。每条关系的 from、to、kind 必须逐字复制下方“允许候选关系”中的同一项；source_refs 的 sample_id 必须来自该项 common_sample_ids。若原文没有显示关系就返回空 relations。不要填写频次，不要代码围栏或说明文字。`,
      user:`${settings}已经核验的结构候选目录：\n${JSON.stringify(catalog)}\n\n允许候选关系：\n${JSON.stringify(pairs)}\n\n冻结样本：\n${samples}\n\n请只在允许候选关系中核对有原句依据的关系，并输出完整 JSON。`

  }

  function normalizeChunkItems(parsed,spec,offset=0) {
    const source=Array.isArray(parsed?.items)?parsed.items:[],structural=Array.isArray(spec.levels),counters={};
    return source.filter(raw=>raw&&typeof raw==='object'&&raw.section===(structural?'structure':spec.key)&&(structural?spec.levels.includes(raw.level):true)).map(raw=>{
      const prefix=structural?spec.prefixes[raw.level]:spec.prefix,index=(counters[prefix]||0)+1;counters[prefix]=index;

    });
  }

  function parseStructuredJSON(text) {
    const original=String(text || '').replace(/^\uFEFF/,'').trim();
    const candidates=[original];
    const fenced=original.match(/```(?:json)?\s*\n?([\s\S]*?)\n?```/i);
    if(fenced)candidates.unshift(fenced[1].trim());
    // Some compatible models prepend a sentence even in JSON mode. Extract only a
    // syntactically complete top-level object; validateReportGroup still applies all
    // schema and verbatim-source checks before the result is displayed.
    const start=original.indexOf('{');
    if(start>=0){
      let depth=0,inString=false,escaped=false;
      for(let index=start;index<original.length;index++){
        const char=original[index];
        if(inString){if(escaped)escaped=false;else if(char==='\\')escaped=true;else if(char==='"')inString=false;continue;}
        if(char==='"'){inString=true;continue;}
        if(char==='{')depth++;
        else if(char==='}'&&--depth===0){candidates.push(original.slice(start,index+1));break;}
      }
    }
    for(const candidate of [...new Set(candidates)]){
      if(!candidate)continue;
      try{const parsed=JSON.parse(candidate);if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed))return parsed;}catch{}
    }
    const opens=(original.match(/{/g)||[]).length,closes=(original.match(/}/g)||[]).length;
    const reason=!original?'模型返回了空内容':opens>closes?'JSON 疑似被截断':`JSON 格式无效（${original.length.toLocaleString()} 字符）`;
    const error=new Error(reason);error.raw=original;throw error;
  }

  function verifiedRefs(value,samples,warnings,label,allowedIds=null) {
    if(!Array.isArray(value)){warnings.push(`${label}：缺少原句来源，已排除。`);return [];}
    const refs=[],seen=new Set();
    for(const ref of value){
      const sampleId=ref?.sample_id,quote=ref?.quote;
      if(!Number.isInteger(sampleId)||!samples.has(sampleId)||!validText(quote,2000)||!samples.get(sampleId).includes(quote)||(allowedIds&&!allowedIds.has(sampleId))){warnings.push(`${label}：已排除无法逐字核对的来源。`);continue;}
      const key=`${sampleId}\u0000${quote}`;
      if(!seen.has(key)){seen.add(key);refs.push({sample_id:sampleId,quote});}
    }
    return refs.sort((a,b)=>a.sample_id-b.sample_id||a.quote.localeCompare(b.quote));
  }

  function withCounts(value,total,basis) {
    const source_ids=[...new Set(value.map(ref=>ref.sample_id))].sort((a,b)=>a-b),itemCount=source_ids.length;
    return {source_ids,count:itemCount,rate:total ? itemCount/total : 0,explicit_count:basis==='explicit'?itemCount:0,reconstructed_count:basis==='reconstructed'?itemCount:0};
  }

  function originalUnits(samples) {
    const units=[];
    for(const [sampleId,text] of [...samples.entries()].sort((a,b)=>a[0]-b[0])){
      let section='unknown',number=0,buffer=[];
      const flush=()=>{const raw=buffer.join('\n').trim();buffer=[];if(raw)units.push({id:`CH${pad(sampleId)}-U${pad(++number).padStart(3,'0')}`,sample_id:sampleId,section,text:raw});};
      for(const line of text.replace(/\r/g,'').split('\n')){
        const heading=line.match(/^\s{0,3}#{1,6}\s*S([124])(?:\s|[·:：./-]|$)/i);
        if(heading){flush();section={1:'background',2:'naive',4:'rebuttal'}[heading[1]];continue;}
        if(!line.trim()){flush();continue;}
        if(/^\s{0,3}(?:[-+*]\s+|\d+[.)、]\s*|#{3,6}\s+)/.test(line))flush();
        buffer.push(line);
      }
      flush();
    }
    return units;
  }

  function sourceCoverage(samples,items) {
    const units=originalUnits(samples),quotes=new Map([...samples.keys()].map(id=>[id,[]]));
    for(const item of items)for(const ref of item.source_refs||[])quotes.get(ref.sample_id)?.push(ref.quote);
    // A unit is linked once at least one mechanically verified quotation points into
    // it. This is linkage coverage, not a claim that every sentence was summarized.
    const unmapped_units=units.filter(unit=>!(quotes.get(unit.sample_id)||[]).some(quote=>unit.text.includes(quote)));
    return {units_total:units.length,units_referenced:units.length-unmapped_units.length,unmapped_units,method:'unit_has_verified_quote'};
  }

  function validateReportGroup(data,samples,stance) {
    if(!data||typeof data!=='object'||!Array.isArray(data.items))throw new Error('结构化报告缺少 items 列表，报告未完成。');
    const warnings=[],items=[],seenIds=new Set(),total=samples.size;
    for(const [index,raw] of data.items.entries()){
      if(!raw||typeof raw!=='object'){warnings.push(`条目 ${index+1}：格式无效，已排除。`);continue;}
      const {id,section,level=null,basis}=raw,label=`条目 ${raw.id || index+1}`;
      if(typeof id!=='string'||!/^[A-Za-z0-9_-]{1,80}$/.test(id)||seenIds.has(id)){warnings.push(`${label}：编号无效或重复，已排除。`);continue;}
      seenIds.add(id);
      if(!REPORT_SECTIONS.includes(section)||!['explicit','reconstructed'].includes(basis)||(section==='structure'?!REPORT_LEVELS.includes(level):(level!==null||basis!=='explicit'))||!validText(raw.title,240)||!validText(raw.summary)){
        warnings.push(`${label}：栏目、层级、证据状态或文本无效，已排除。`);continue;
      }
      const refs=verifiedRefs(raw.source_refs,samples,warnings,label);
      if(!refs.length){warnings.push(`${label}：没有通过原句核验的来源，已排除。`);continue;}
      const derived=Array.isArray(raw.derived_from)&&raw.derived_from.every(value=>typeof value==='string')?[...new Set(raw.derived_from)]:null;
      if(!derived||(section!=='structure'&&derived.length)){warnings.push(`${label}：朴素来源编号无效，已排除。`);continue;}
      items.push({id,section,level,title:raw.title.trim(),summary:raw.summary.trim(),basis,source_refs:refs,derived_from:derived,...withCounts(refs,total,basis)});
    }
    const bases=new Map(items.filter(item=>['background','naive'].includes(item.section)).map(item=>[item.id,item]));
    const validItems=items.filter(item=>{
      if(item.section!=='structure')return true;
      const origins=item.derived_from.map(id=>bases.get(id));
      const originIds=new Set(origins.filter(Boolean).flatMap(origin=>origin.source_ids));
      const ok=origins.length&&origins.every(Boolean)&&item.source_ids.every(id=>originIds.has(id))&&(item.level!=='subargument'||origins.some(origin=>origin.section==='naive'));

    });
    if(!validItems.length)throw new Error('没有通过来源核验的有效条目，报告未完成。请重试蒸馏。');

    for(const [index,raw] of (Array.isArray(data.relations)?data.relations:[]).entries()){
      const label=`关系 ${index+1}`,from=nodes.get(raw?.from),to=nodes.get(raw?.to),levels=RELATION_LEVELS[raw?.kind];
      if(!from||!to||!levels||from.level!==levels[0]||to.level!==levels[1]||!['explicit','reconstructed'].includes(raw.basis)||!validText(raw.explanation)){warnings.push(`${label}：节点、方向或解释无效，已排除。`);continue;}
      const shared=new Set(from.source_ids.filter(id=>to.source_ids.includes(id))),refs=verifiedRefs(raw.source_refs,samples,warnings,label,shared);
      if(!refs.length)continue;
      const relationBasis=raw.basis==='explicit'&&(from.basis==='reconstructed'||to.basis==='reconstructed')?'reconstructed':raw.basis;
      const key=`${raw.from}|${raw.to}|${raw.kind}|${relationBasis}`;if(seenRelations.has(key))continue;seenRelations.add(key);
      relations.push({from:raw.from,to:raw.to,kind:raw.kind,basis:relationBasis,explanation:raw.explanation.trim(),source_refs:refs,...withCounts(refs,total,relationBasis)});
    }
    const notes=Array.isArray(data.notes)?[...new Set(data.notes.filter(note=>validText(note)).map(note=>note.trim()))]:[];
    const missing=REPORT_LEVELS.filter(level=>!validItems.some(item=>item.section==='structure'&&item.level===level)).map(level=>REPORT_LEVEL_NAMES[level]);
    if(missing.length)notes.push(`当前样本未提供或未能核实这些结构层：${missing.join('、')}；未补造完整架构。`);
    if(!relations.length)notes.push('未获得可核实来源的跨层关系；孤立条目不自动连线。');
    notes.push('浏览器核验引文逐字存在并按来源去重计数；语义归并仍是模型分析，原句匹配不保证解释正确。');
    const coverage=sourceCoverage(samples,validItems);
    notes.push('原文回查按段落或项目标记是否至少有一条已核验引文关联；这不是逐句覆盖率或语义完整性评分。');
    return {stance,total,items:validItems,relations,notes:[...new Set(notes)],warnings,coverage};
  }

  const mdLiteral=value=>String(value).replace(/\r?\n/g,' ').replace(/([\\*_\[\]<>|#!`])/g,'\\$1');
  const frequency=(item,total)=>item.basis==='reconstructed'?`重构覆盖 ${item.count}/${total}`:`${item.rate>=.7?'高频':item.rate>=.3?'中频':'低频'} ${item.count}/${total}`;
  function renderReportItem(item,total,depth=3){
    const rows=[`${'#'.repeat(depth)} ${mdLiteral(item.title)} [${frequency(item,total)}]`,'',`来源：${item.source_ids.map(id=>`CH${pad(id)}`).join('、')}`,'',mdLiteral(item.summary),'',`证据状态：${item.basis==='explicit'?'原文明示。':'分析重构；比例表示有原句依据的覆盖，不表示样本自然提出了完整结构。'}`,''];
    if(item.derived_from.length)rows.push(`朴素来源项：${item.derived_from.join('、')}`,'');
    for(const ref of item.source_refs)rows.push(`> CH${pad(ref.sample_id)}：${mdLiteral(ref.quote)}`,'');
    return rows;
  }
  function renderQuickSummary(group){
    const rows=['## 快速文字汇总','','以下按板块列出“结果 — 简短解释 — 本轮频率”；详细来源与逐字引文见后文。',''];
    const blocks=[
      ['background',null,'S1 · 朴素背景 / 场景'],['naive',null,'S2 · 朴素论点'],
      ['structure','inherent','L1 · 固有定义域'],['structure','entry','L2 · 切入 / 演绎定义域'],
      ['structure','criterion','L3 · 标准 B0'],['structure','subargument','L4 · 分论点'],
      ['rebuttal',null,'S4 · 朴素反驳']
    ];
    for(const [section,level,title] of blocks){
      const items=group.items.filter(item=>item.section===section&&(!level||item.level===level)).sort((a,b)=>b.count-a.count||a.id.localeCompare(b.id));
      rows.push(`### ${title}`,'');
      if(!items.length)rows.push('- 当前样本没有通过核验的候选，保留缺口。','');
      else for(const item of items)rows.push(`- **${mdLiteral(item.title)}** — ${mdLiteral(item.summary)} _[${frequency(item,group.total)}]_`);
      rows.push('');
    }
    if(group.relations.length){
      rows.push('### 跨层候选关联','');
      for(const edge of group.relations){const from=group.items.find(item=>item.id===edge.from),to=group.items.find(item=>item.id===edge.to);if(from&&to)rows.push(`- **${mdLiteral(from.title)} → ${mdLiteral(to.title)}** — ${mdLiteral(edge.explanation)} _[${frequency(edge,group.total)}]_`);}

        this.$('.copy').disabled = this.$('.download').disabled = this.$('.download-html').disabled = false;

        this.dispatchEvent(new CustomEvent('debate-complete', {detail:{markdown:this.result,report:run.report,branches:valid,branch_stances:branchStances,branch_ids:branchIds,motion:data.motion,stance:data.stance,include_neutral:data.include_neutral,debate_format:data.format,audience_context:data.audience_context}, bubbles:true, composed:true}));
      } catch (error) {
        if (!run.cancelled && error.name !== 'AbortError') {
          run.branches.forEach((branch,index) => {
            if (['queued','running'].includes(branch.state)) { branch.error = error.message; this.setBranch(index,'error'); }
          });
          this.setNotice(`生成失败：${error.message}`, true);
          this.setPhase('ERROR', 'ACTION REQUIRED');
          if (run.phase === 'aggregate') { this.$('.aggregate').dataset.state = 'error'; this.$('.summary-meta').textContent = '蒸馏失败 · 未完成'; }
          run.phase = 'error';
        }
      } finally {
        if (run.cancelled) {
          run.phase = 'stopped';
          this.setPhase('STOPPED', 'CONSOLE READY');
          if (this.$('.aggregate').dataset.state === 'running') { this.$('.aggregate').dataset.state = 'stopped'; this.$('.summary-meta').textContent = '已停止 · 未完成'; }
          this.setNotice('已停止。完整样本与已接收的部分正文仍可查看。');
        }
        clearInterval(this.timer);
        this.updateElapsed(run);
        this.flushRender();
        this.updateProgress();
        this.running = false;
        this.toggleControls(false);
      }
    }

    stop() {
      if (!this.running || this.run.cancelled) return;
      this.run.cancelled = true;
      this.controllers.forEach(controller => controller.abort());
      this.run.branches.forEach((branch,i) => { if (['queued','running'].includes(branch.state)) this.setBranch(i,'stopped'); });
      this.$('.stop').disabled = true;
      this.setNotice('正在取消运行中的请求…');
      // Keep start disabled until all workers settle, so old callbacks cannot affect a new run.
    }

    async deepSeekStream(data, system, user, onToken, jsonOutput=false) {
      const controller=new AbortController();this.controllers.add(controller);let reader;
      const base=String(data.apiUrl || 'https://api.deepseek.com').replace(/\/+$/,'');
      const maxTokens=count(data.maxTokens,1000000,8192);
      const body={model:String(data.model || '').trim(),messages:[{role:'system',content:system},{role:'user',content:user}],stream:true,max_tokens:maxTokens};
      if(jsonOutput)body.response_format={type:'json_object'};
      if(data.thinkingMode==='on')body.thinking={type:'enabled'};
      else if(data.thinkingMode==='off')body.thinking={type:'disabled'};
      Object.assign(body,data.parsedThinkingParams || {});
      try{
        const response=await fetch(`${base}/chat/completions`,{
          method:'POST',mode:'cors',credentials:'omit',referrerPolicy:'no-referrer',signal:controller.signal,
          headers:{'Content-Type':'application/json','Authorization':`Bearer ${data.apiKey}`},body:JSON.stringify(body)
        });
        if(!response.ok){
          const detail=await response.json().catch(()=>null),message=detail?.error?.message||detail?.message||`DeepSeek 接口错误 ${response.status}`;
          if(response.status===401)throw new Error('DeepSeek API Key 无效或已失效。');
          if(response.status===402)throw new Error('DeepSeek 账户余额不足或当前请求不可计费。');
          if(response.status===429)throw new Error('DeepSeek 请求过于频繁，请降低并发后重试。');
          throw new Error(message);
        }
        if(!response.body)throw new Error('当前浏览器不支持读取流式响应。');
        reader=response.body.getReader();const decoder=new TextDecoder();let buffer='',output='',finished=false,doneMarker=false;
        const consume=line=>{
          const trimmed=line.trim();if(!trimmed||trimmed.startsWith(':'))return;
          if(!trimmed.startsWith('data:'))return;
          const payload=trimmed.slice(5).trim();if(payload==='[DONE]'){doneMarker=true;return;}
          let event;try{event=JSON.parse(payload);}catch{throw new Error('DeepSeek 返回了无法解析的流式数据。');}
          if(event.error)throw new Error(event.error.message||'DeepSeek 生成失败。');
          const choice=event.choices?.[0];if(!choice)return;
          const token=choice.delta?.content;if(typeof token==='string'&&token){output+=token;onToken?.(token);}
          if(choice.finish_reason==='length')throw new Error('输出达到长度上限，内容不完整；请调高输出上限后重试。');
          if(choice.finish_reason==='stop')finished=true;
          else if(choice.finish_reason)throw new Error(`模型中止了输出：${choice.finish_reason}`);
        };
        while(!doneMarker){
          const {value,done}=await reader.read();if(controller.signal.aborted)throw new DOMException('已停止','AbortError');
          buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines)consume(line);
          if(done){consume(buffer);break;}
        }
        if(!finished)throw new Error('DeepSeek 连接提前结束，未收到完整结束标记。');
        return output;
      }catch(error){
        if(error instanceof TypeError&&!controller.signal.aborted)throw new Error('浏览器无法连接 DeepSeek。请检查网络；若供应商日后关闭 file:// 跨域访问，则仍需使用后端版。');
        throw error;
      }finally{
        if(reader){try{await reader.cancel();}catch{}try{reader.releaseLock();}catch{}}
        this.controllers.delete(controller);
      }
    }

    async requestSamples(data,onBranch) {
      const plan=this.samplingPlan(data.sample_count,this.perspectives(data.stance,data.include_neutral));let next=0;
      const worker=async()=>{
        while(next<plan.length){
          const index=next++,item=plan[index],prompts=makePrompts(data,item.stance);onBranch?.({type:'branch_start',index,stance:item.stance});
          try{
            await this.deepSeekStream(data,prompts.system,prompts.user,token=>onBranch?.({type:'token',index,stance:item.stance,token}));
            onBranch?.({type:'branch_done',index,stance:item.stance});
          }catch(error){
            if(error.name==='AbortError')throw error;
            onBranch?.({type:'branch_error',index,stance:item.stance,message:error.message||'生成失败'});
          }
        }
      };
      await Promise.all(Array.from({length:Math.min(plan.length,count(data.parallel,10,10))},worker));return '';
    }

    async runAggregateChunk(data,prompts,stance,chunk,onEvent) {
      const requestData={...data,thinkingMode:'off',parsedThinkingParams:{}},run=async(user,retry=false)=>{
        let raw='',chars=0;
        try{
          raw=await this.deepSeekStream(requestData,prompts.system,user,token=>{chars+=token.length;onEvent?.({type:'aggregate_progress',stance,chunk,chars});},true);
          return parseStructuredJSON(raw);
        }catch(error){
          if(error.name==='AbortError'||/API Key|余额不足/.test(error.message))throw error;
          this.lastInvalidAggregate={stance,chunk,text:raw,reason:error.message};
          console[retry?'error':'warn'](`认知星图：${chunk}${retry?'重试仍失败':'返回异常，正在重试'}。`,this.lastInvalidAggregate);
          if(retry)throw new Error(`${chunk}自动重试仍失败：${error.message}`);
          onEvent?.({type:'aggregate_retry',stance,chunk,message:error.message});
          const retryUser=`${user}\n\n格式纠正：请重新完成这个分块，只输出一个较短但完整的 JSON 对象；不要代码围栏、前言、后记或省略号。确保字符串正确转义并闭合，保留所有有来源的不同候选。`;
          return run(retryUser,true);
        }
      };
      return run(prompts.user);
    }

    async buildAggregateGroup(data,stance,records,onEvent) {
      const samples=new Map(records.map(record=>[record.id,record.text])),notes=[];

      // Stage A: S1, S2 and S4 are independent views of the same frozen samples.
      const rawParts=await Promise.all(RAW_CHUNKS.map(async spec=>{
        const parsed=await this.runAggregateChunk(data,makeRawChunkPrompts(data,stance,records,spec),stance,spec.label,onEvent);
        const items=normalizeChunkItems(parsed,spec);
        if(!items.length)notes.push(`${spec.label}分块没有返回可用候选。`);
        if(Array.isArray(parsed.notes))notes.push(...parsed.notes.filter(note=>validText(note)));
        return items;
      }));
      const rawCandidateItems=rawParts.flat();
      const verifiedRaw=validateReportGroup({items:rawCandidateItems,relations:[],notes:[]},samples,stance).items;

      // Stage B: paired adjacent layers run in parallel after stable raw IDs exist.
      const structureParts=await Promise.all(STRUCTURE_CHUNKS.map(async spec=>{
        const parsed=await this.runAggregateChunk(data,makeStructureChunkPrompts(data,stance,records,spec,verifiedRaw),stance,spec.label,onEvent);
        const items=normalizeChunkItems(parsed,spec);
        if(!items.length)notes.push(`${spec.label}分块没有返回可用候选，保留该层缺口。`);
        if(Array.isArray(parsed.notes))notes.push(...parsed.notes.filter(note=>validText(note)));
        return items;
      }));
      const allCandidates=[...verifiedRaw,...structureParts.flat()];
      const verifiedCandidates=validateReportGroup({items:allCandidates,relations:[],notes:[]},samples,stance).items;

      // Stage C depends on the final candidate IDs, so it intentionally runs last.
      const relationParsed=await this.runAggregateChunk(data,makeRelationChunkPrompts(data,stance,records,verifiedCandidates),stance,'层间关系',onEvent);
      if(Array.isArray(relationParsed.notes))notes.push(...relationParsed.notes.filter(note=>validText(note)));
      return validateReportGroup({items:verifiedCandidates,relations:Array.isArray(relationParsed.relations)?relationParsed.relations:[],notes},samples,stance);
    }

    async requestAggregate(data,onToken,onEvent) {
      const records=data.branches.map((text,index)=>({text,stance:data.branch_stances[index],id:data.branch_ids[index]}));
      const groups=[];let markdown='';
      for(const stance of this.perspectives(data.stance,data.include_neutral)){
        const selected=records.filter(record=>record.stance===stance);
        if(!selected.length){
          const group={stance,total:0,items:[],relations:[],warnings:[],coverage:{units_total:0,units_referenced:0,unmapped_units:[],method:'paragraph_reference'},notes:['本视角没有完整成功样本，未进行蒸馏。']};
          groups.push(group);onEvent?.({type:'report_group',group});const part=`# ${stance==='中立'?'中立观察':stance}\n\n本视角没有完整成功样本，未进行蒸馏。\n\n`;markdown+=part;onToken?.(part);continue;
        }
        const group=await this.buildAggregateGroup(data,stance,selected,onEvent);groups.push(group);onEvent?.({type:'report_group',group});
        const part=renderReportGroup(group);markdown+=part;onToken?.(part);
      }
      const report={schema_version:2,groups};onEvent?.({type:'report',report});return markdown;
    }

    async request(data,onToken,onBranch,onEvent) {
      if(data.provider!=='deepseek')throw new Error('此纯 HTML 版本目前仅支持 DeepSeek。');
      if(!String(data.apiKey||'').trim())throw new Error('请填写 DeepSeek API Key。');
      if(!String(data.model||'').trim())throw new Error('请填写 DeepSeek 模型 ID。');
      if(data.kind==='sample')return this.requestSamples(data,onBranch);
      if(data.kind==='aggregate')return this.requestAggregate(data,onToken,onEvent);
      const prompts=makePrompts(data,data.stance);return this.deepSeekStream(data,prompts.system,prompts.user,onToken);
    }

    setBranch(index, state) {
      const branch = this.run.branches[index];
      branch.state = state;
      const card = this.cards[index];
      card.dataset.state = state;
      card.querySelector('.branch-state').textContent = stateNames[state];
      const error = card.querySelector('.branch-error');
      error.hidden = !branch.error;
      error.textContent = branch.error;
      this.queueRender(index);
      this.updateProgress();
    }

    queueRender(index) {
      this.dirty.add(index);
      if (this.frame === null) this.frame = requestAnimationFrame(() => this.flushRender());
    }

    flushRender() {
      if (this.frame !== null) cancelAnimationFrame(this.frame);
      this.frame = null;
      this.dirty.forEach(index => {
        if (index === 'aggregate') this.renderText(this.$('.result'), this.result);
        else {
          const branch = this.run.branches[index], card = this.cards[index];
          this.renderText(card.querySelector('.stream'), branch.text);
          card.querySelector('.branch-chars').textContent = `${branch.text.length.toLocaleString()} 字符`;
          const sections = [...branch.text.matchAll(/^#{1,6}\s*(S[124])\b/gm)];
          const stage = sections.length ? sections[sections.length-1][1] : null;
          card.querySelector('.branch-stage').textContent = stage ? `${stage} ${stageNames[stage]}` : (branch.state === 'running' ? (branch.text ? '接收正文' : '等待首字') : stateNames[branch.state]);
          if(this.dialogBranchIndex===index&&this.$('.branch-dialog').open)this.updateBranchDialog();
        }
      });
      this.dirty.clear();
    }

    renderText(element, text) {
      const follow = element.scrollHeight - element.scrollTop - element.clientHeight < 32;
      element.textContent = text;
      if (follow) element.scrollTop = element.scrollHeight;
    }

    appendInline(parent, text) {
      // Parse a small Markdown subset into DOM nodes; untrusted HTML stays literal text.
      const pattern = /\[(高频|中频|低频|重构覆盖)\s+(\d+)\s*\/\s*(\d+)\]|\*\*([^*]+)\*\*|`([^`]+)`|\[([^\]]+)\]\(([^)]+)\)/g;
      let start = 0;
      for (const match of text.matchAll(pattern)) {
        parent.append(document.createTextNode(text.slice(start,match.index)));
        let node;
        if (match[1]) {
          node = document.createElement('span');
          node.className = `frequency ${match[1] === '重构覆盖' ? 'reconstructed' : match[1] === '高频' ? 'high' : match[1] === '中频' ? 'medium' : 'low'}`;
          node.append(document.createTextNode(`${match[1]} ${match[2]}/${match[3]}`));
          const track = document.createElement('span'), fill = document.createElement('span');
          track.className = 'frequency-track'; fill.className = 'frequency-fill';
          fill.style.width = `${Math.min(1,Number(match[2])/Math.max(1,Number(match[3])))*100}%`;
          track.setAttribute('aria-hidden','true'); track.append(fill); node.append(track);
        } else if (match[4]) { node = document.createElement('strong'); this.appendInline(node,match[4]); }
        else if (match[5]) { node = document.createElement('code'); node.textContent = match[5]; }
        else {
          node = document.createElement('span'); node.textContent = match[6];
          try {
            const url = new URL(match[7]);
            if (['http:','https:'].includes(url.protocol)) {
              node = document.createElement('a'); node.textContent = match[6];
              node.href = url.href; node.target = '_blank'; node.rel = 'noopener noreferrer';
            }
          } catch {}
        }
        parent.append(node); start = match.index + match[0].length;
      }
      parent.append(document.createTextNode(text.slice(start)));
    }

    renderReport() {
      const documentView = this.$('.report-document'), nav = this.$('.report-tabs');
      documentView.replaceChildren(); nav.replaceChildren();
      const lines = this.result.replace(/\r/g,'').split('\n');
      const add = (tag,text,parent=documentView) => { const el=document.createElement(tag); this.appendInline(el,text); parent.append(el); return el; };
      const cells = line => line.trim().replace(/^\||\|$/g,'').split('|').map(cell=>cell.trim());
      let list = null, reportStance = '';
      for (let i=0;i<lines.length;i++) {
        const line = lines[i];
        if (!line.trim()) { list=null; continue; }
        if (/^```/.test(line)) {
          const block=[];
          while (++i < lines.length && !/^```/.test(lines[i])) block.push(lines[i]);
          const pre=document.createElement('pre'); pre.textContent=block.join('\n'); documentView.append(pre); list=null; continue;
        }
        if (line.includes('|') && i+1<lines.length && cells(lines[i+1]).every(cell=>/^:?-{3,}:?$/.test(cell))) {
          const wrap=document.createElement('div'), table=document.createElement('table');
          wrap.className='report-table-wrap'; wrap.append(table); documentView.append(wrap);
          const tr=document.createElement('tr'); cells(line).forEach(cell=>add('th',cell,tr));
          const head=document.createElement('thead'); head.append(tr); table.append(head);
          const body=document.createElement('tbody'); table.append(body); i++;
          while (i+1<lines.length && lines[i+1].includes('|') && lines[i+1].trim()) { i++; const row=document.createElement('tr'); cells(lines[i]).forEach(cell=>add('td',cell,row)); body.append(row); }
          list=null; continue;
        }
        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          const el = add(`h${heading[1].length}`,heading[2]);
          const group = heading[2].match(/^(正方|反方|中立)(?:观察)?$/);
          if (group) {
            reportStance = group[1];
            const button=document.createElement('button'); button.type='button'; button.dataset.stance=reportStance;
            button.textContent=reportStance === '中立' ? '中立观察' : reportStance;
            button.addEventListener('click',()=>documentView.scrollTo({top:el.offsetTop-18,behavior:'instant'})); nav.append(button);
          }
          const section = heading[2].match(/^(?:S[1234]|L[1234])\b/);
          const sectionKey = section ? `${reportStance || 'single'}-${section[0]}` : '';
          if (section && !nav.querySelector(`[data-section-key="${sectionKey}"]`)) {
            const button=document.createElement('button'); button.type='button'; button.dataset.section=section[0]; button.dataset.sectionKey=sectionKey;
            const names={...stageNames,...levelNames};
            button.textContent=`${reportStance ? `${reportStance === '中立' ? '观察' : reportStance} · ` : ''}${section[0]} ${names[section[0]]}`;
            el.dataset.section=section[0];
            button.addEventListener('click',()=>documentView.scrollTo({top:el.offsetTop-18,behavior:'instant'}));
            nav.append(button);
          }
          list=null; continue;
        }
        if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { documentView.append(document.createElement('hr')); list=null; continue; }
        const quote=line.match(/^>\s?(.*)$/);
        if (quote) { add('blockquote',quote[1]); list=null; continue; }
        const item=line.match(/^\s*(?:([-*+])|\d+[.)])\s+(.+)$/);
        if (item) {
          const tag=item[1]?'ul':'ol';
          if (!list || list.localName!==tag) { list=document.createElement(tag); documentView.append(list); }
          add('li',item[2],list); continue;
        }
        add('p',line); list=null;
      }
      documentView.hidden = false;
      documentView.scrollTop = 0;
      this.$('.result').hidden = true;
      this.$('.report-tools').hidden = false;
      this.$('.report-toggle').disabled = false;
      this.$('.report-toggle').textContent = 'Markdown 原文';
      this.renderSummary();
      void this.renderMap();
    }

    renderSummary() {
      const run=this.run,host=this.$('.report-summary');
      if(!this.resultComplete||!run)return;
      this.$('.summary-panel').hidden=false;
      try {
        if(!globalThis.COGNITIVE_ATLAS_MAP?.renderSummary)throw new Error('文字汇总模块未能初始化。');
        globalThis.COGNITIVE_ATLAS_MAP.renderSummary(host,{report:run.report,samples:run.branches,isDemo:!!run.isDemo,motion:run.data.motion,theme:this.dataset.theme||'dark'});
      } catch(error) { host.textContent=error.message; }
    }

    async renderMap() {
      const run=this.run, markdown=this.result;
      if (!this.resultComplete || !run) return;
      const host=this.$('.report-map');
      this.$('.map-panel').hidden=false;
      try {
        if (!globalThis.COGNITIVE_ATLAS_MAP?.normalize) {
          host.textContent='正在绘制分层认知图…';
          if (!this.mapLoading) this.mapLoading=(async()=> {
            const files=globalThis.COGNITIVE_ATLAS_MAP ? ['atlas-report.js'] : ['report-map.js','atlas-report.js'];
            for(const file of files) await new Promise((resolve,reject)=> {
              const script=document.createElement('script'); script.src=new URL(file,assetBase).href;
              script.onload=resolve; script.onerror=()=>{script.remove();reject(new Error('星图模块加载失败，完整文字报告仍可阅读。'));}; document.head.append(script);
            });
            if(!globalThis.COGNITIVE_ATLAS_MAP?.normalize) throw new Error('分层星图模块未能初始化，完整文字报告仍可阅读。');
          })().catch(error=>{this.mapLoading=null;throw error;});
          await this.mapLoading;
        }
        if (this.run!==run || !this.resultComplete || this.result!==markdown || !this.isConnected) return;
        globalThis.COGNITIVE_ATLAS_MAP.render(host,{report:run.report,markdown,samples:run.branches,mode:run.data.stance,isDemo:!!run.isDemo,motion:run.data.motion,theme:this.dataset.theme || 'dark'});
      } catch(error) {
        if (this.run===run && this.result===markdown) host.textContent=error.message;
      }
    }

    async showDemo() {
      if (this.running) return;
      const previousRun = this.run;
      try {
        if (!globalThis.COGNITIVE_ATLAS_DEMO) {
          await new Promise((resolve,reject) => {
            const script = document.createElement('script');
            script.src = new URL('demo-report.js',assetBase).href;
            script.onload=resolve; script.onerror=()=>{script.remove();reject(new Error('演示报告文件加载失败'));};
            document.head.append(script);
          });
        }
        if (!this.isConnected || this.running || this.run !== previousRun) return;
        const demo=globalThis.COGNITIVE_ATLAS_DEMO;
        this.run={isDemo:true,phase:'complete',data:demo,total:10,parallel:10,cancelled:false,report:demo.report,branches:demo.branches.map((text,index)=>({id:index+1,stance:'正方',state:'complete',text,error:''}))};
        this.result=demo.markdown; this.resultComplete=true;
        this.renderBranches(this.run.branches);
        this.run.branches.forEach((branch,index)=>this.setBranch(index,'complete'));
        this.flushRender();
        this.setPhase('DEMO / 10','REPORT PREVIEW');
        this.$('.elapsed').textContent='—';
        this.$('.aggregate').open=true;
        this.$('.aggregate').dataset.state='complete';
        this.$('.summary-meta').textContent='演示报告';
        this.$('.aggregate-content').hidden=false;
        this.$('.empty-state').hidden=true;
        this.$('.demo-banner').hidden=false;
        this.$('.demo-banner').textContent='固定演示数据 · 10 份正方示例，没有调用真实模型。表单中的“双方”是下一次运行设置，不改变这份报告的正方视角。';
        this.$('.report-motion').textContent=demo.motion;
        this.$('.aggregate-caption').textContent=`正方 10/10 份成功（示例） · 用户设定：${demo.audience_context}`;
        this.$('.display').classList.add('report-ready');
        this.$('.result').textContent=this.result;
        this.$('.copy').disabled=this.$('.download').disabled=this.$('.download-html').disabled=false;
        this.renderReport();
        this.setNotice('以下为固定示例分支，用于核对报告中的频次与来源；未调用真实模型。');
        if (matchMedia('(max-width:860px)').matches) this.$('.distribution').scrollIntoView({block:'start',behavior:'instant'});
      } catch(error) { this.setNotice(error.message,true); }
    }

    updateProgress() {
      const branches = this.run.branches;
      const states = name => branches.filter(branch => branch.state === name).length;
      const active = states('running'), queued = states('queued'), complete = states('complete'), failed = states('error'), stopped = states('stopped');
      const ended = complete + failed + stopped;
      this.$('.active-count').textContent = pad(active);
      this.$('.complete-count').textContent = pad(complete);
      this.$('.queued-count').textContent = pad(queued);
      this.$('.progress-label').textContent = `已结束 ${ended} 份 · 成功 ${complete}${failed ? ` · 失败 ${failed}` : ''}${stopped ? ` · 停止 ${stopped}` : ''}`;
      this.$('.progress-numbers').textContent = `${ended} / ${branches.length}`;
      this.$('.progress span').style.width = `${ended / branches.length * 100}%`;
      this.$('.progress').setAttribute('aria-valuenow', ended);
    }

    updateElapsed(run) {
      const seconds = Math.floor((performance.now() - run.started)/1000);
      this.$('.elapsed').textContent = `${pad(Math.floor(seconds/60))}:${pad(seconds%60)}`;
    }
    setPhase(phase, system) { this.$('.phase-tag').textContent = phase; this.$('.system-label').textContent = system; }
    setNotice(message, error = false) { this.$('.notice').textContent = message; this.$('.notice').classList.toggle('error', error); }
    toggleControls(busy) {
      [...this.form.elements].forEach(element => { element.disabled = busy; });
      this.$('.stop').disabled = !busy;
      this.$('.start').textContent = busy ? '认知采样运行中…' : '启动认知采样 ↗';
    }
    download() {
      if (!this.resultComplete) return;
      const data = this.run.data;
      const metadata = `# 认知星图 · 认知分布${this.run.isDemo ? '（演示数据）' : ''}\n\n辩题：${data.motion}\n采样视角：${data.stance}${data.include_neutral ? ' + 中立观察' : ''}\n赛制：${data.format}\n观众 / 背景：${data.audience_context || '未设定'}\n样本完成情况：${this.groupSummary()}\n频率分母：各视角分别使用本组成功样本数，不合并计算。\n\n---\n\n`;
      const url = URL.createObjectURL(new Blob([metadata,this.result], {type:'text/markdown;charset=utf-8'}));
      const link = document.createElement('a');
      link.href = url;
      link.download = `认知星图${this.run.isDemo ? '-演示报告' : ''}-${new Date().toISOString().slice(0,10)}.md`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    async downloadHTML() {
      if (!this.resultComplete || !this.run) return;
      const run = this.run, markdown = this.result;
      try {
        await this.renderMap();
        if (this.run !== run || !this.resultComplete || this.result !== markdown) return;
        if (!globalThis.COGNITIVE_ATLAS_MAP?.exportHTML) throw new Error('报告导出模块暂不可用，请稍后再试。');
        const html = globalThis.COGNITIVE_ATLAS_MAP.exportHTML({report:run.report,markdown,samples:run.branches,mode:run.data.stance,isDemo:!!run.isDemo,motion:run.data.motion,theme:this.dataset.theme || 'dark'});
        const url = URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
        const link = document.createElement('a'); link.href = url;
        link.download = `认知星图${run.isDemo ? '-演示' : ''}-报告-${new Date().toISOString().slice(0,10)}.html`;
        link.click(); setTimeout(() => URL.revokeObjectURL(url),1000);
      } catch (error) { this.setNotice(error.message,true); }
    }
  }
  if (!customElements.get('debate-universe')) customElements.define('debate-universe', DebateUniverse);
})();

</script>
  </body>
</html>
